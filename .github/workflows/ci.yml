name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here writes back to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify, not test: the release runs `mvn -B verify`, and a javadoc or
      # packaging break is invisible to `mvn test`. Catching it here rather than
      # on the tag keeps a broken build off Central.
      - name: Build and test
        run: mvn -B verify
