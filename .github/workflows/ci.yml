name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here writes back to the repository.
permissions:
  contents: read

jobs:
  test:
    # maven.compiler.release in pom.xml guards the API surface, not the
    # runtime, so every LTS from that floor up runs the suite. One Windows leg
    # catches line-ending and socket differences; more would only repeat it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [17, 21, 25]
        include:
          - os: windows-latest
            java: 17
    name: JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify, not test: the release runs `mvn -B verify`, and a javadoc or
      # packaging break is invisible to `mvn test`. Catching it here rather than
      # on the tag keeps a broken build off Central.
      - name: Build and test
        run: mvn -B verify

      # The README promises JUnit 5.8 or later while the code compiles against
      # 6; one leg proves the floor.
      - name: Test against JUnit 5.8
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        run: mvn -B test -Djunit.version=5.8.2
