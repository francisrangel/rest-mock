name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify, not test: the release runs `mvn -B verify`, and a javadoc or
      # packaging break is invisible to `mvn test`. Catching it here rather than
      # on the tag keeps a broken build off Central.
      - name: Build and test
        run: mvn -B verify
