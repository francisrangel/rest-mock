name: Release to Maven Central

# Triggered by pushing a tag like v0.1.0. Signs every artifact with the
# committer's GPG key, uploads to the Central Portal, and publishes a
# Sigstore-signed build provenance attestation.
#
# Central publishes the deployment once it validates; a failed one stays
# staged (see scripts/rollback.sh).
#
# Required secrets (set once via scripts/setup-release-secrets.sh):
#   MAVEN_GPG_PRIVATE_KEY     - ASCII-armored secret key
#   MAVEN_GPG_PASSPHRASE      - passphrase for the key above
#   MAVEN_CENTRAL_USERNAME    - Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD    - Central Portal user-token password

on:
  push:
    tags:
      - 'v*'

# Workflow needs only read access to the repo. Provenance attestation
# additionally needs id-token:write (to mint an OIDC token Sigstore can
# verify) and attestations:write (to record the attestation against the
# repo). No contents:write - we never push back.
permissions:
  contents: read
  id-token: write
  attestations: write

# Two tag pushes in close succession would otherwise race for the same
# Central deployment. The group key is constant (not per-tag) so all
# release runs serialize. Don't cancel an in-flight deploy: a half-
# finished upload is worse than a queued one.
concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17 + GPG + Central credentials
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify build
        run: mvn -B verify

      - name: Deploy signed artifacts to Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -P release deploy -DskipTests

      - name: Attest build provenance for released artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/restmock-*.jar
