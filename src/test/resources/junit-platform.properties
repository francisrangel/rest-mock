# Parallel execution is available but off by default: most of this suite drives
# the process-wide default mock and must stay on one thread.
#
# A class that owns its own HttpMock can opt in with @Execution(CONCURRENT).
# That is the point of the instance seam, and ParallelMockTestCase proves it
# holds by running two such classes at once.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = same_thread
